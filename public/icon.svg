<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="paint" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff5a1a"/>
      <stop offset="1" stop-color="#ffa033"/>
    </linearGradient>
  </defs>
  <!-- Solid, so the padded (maskable) icon has no visible edge -->
  <rect width="512" height="512" fill="#0d0f12"/>
  <!-- The bike, centred and filling the tile -->
  <g transform="translate(256 256) scale(1.08) translate(-233 -279)">
  <!-- Speed streaks -->
  <g stroke="#ff7a1a" stroke-linecap="round" opacity="0.5" stroke-width="9">
    <line x1="22" y1="232" x2="84" y2="232"/>
    <line x1="10" y1="266" x2="96" y2="266"/>
    <line x1="34" y1="300" x2="104" y2="300"/>
  </g>
  <!-- Wheels -->
  <g fill="none" stroke="url(#paint)" stroke-width="20">
    <circle cx="150" cy="342" r="60"/>
    <circle cx="372" cy="342" r="60"/>
  </g>
  <g fill="#0d0f12" stroke="#ffa033" stroke-width="6">
    <circle cx="150" cy="342" r="13"/>
    <circle cx="372" cy="342" r="13"/>
  </g>
  <!-- Swingarm and fork -->
  <g stroke="url(#paint)" stroke-linecap="round">
    <line x1="150" y1="342" x2="252" y2="304" stroke-width="18"/>
    <line x1="364" y1="226" x2="372" y2="342" stroke-width="15"/>
  </g>
  <!-- Supersport body: upswept tail, seat, tank, screen, sharp nose, belly pan -->
  <path fill="url(#paint)" d="
    M 70 212 L 122 222 L 196 240 L 222 226
    C 250 214, 290 212, 318 220
    L 352 206
    C 384 212, 420 232, 456 264
    L 448 274
    C 422 288, 388 300, 346 308
    L 300 318 L 236 320 L 214 300 L 190 268 L 120 240 Z"/>
  <!-- Fairing vent -->
  <path fill="#0d0f12" opacity="0.55" d="M 348 262 L 414 254 L 404 272 L 344 280 Z"/>
  <!-- Rider tucked in over the tank -->
  <g fill="#f4f4f4">
    <path d="M 186 236 C 196 206, 240 182, 300 180 L 312 210 C 280 222, 252 236, 236 240 Z"/>
    <circle cx="322" cy="184" r="25"/>
  </g>
  <path fill="#0d0f12" d="M 326 176 L 346 176 C 346 186, 342 192, 334 194 L 322 192 Z"/>
  <g stroke="#f4f4f4" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <polyline points="300,198 334,214 356,222" stroke-width="13"/>
    <polyline points="214,238 262,262 230,288" stroke-width="17"/>
  </g>
  </g>
</svg>
